<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetPlus — Pet Care &amp; Shelter Management</title>
  <meta name="description" content="PetPlus is a complete Pet Care and Shelter Management platform connecting pets, owners, veterinarians, and shelters.">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-layout">

  <!-- ===== MOBILE SIDEBAR OVERLAY ===== -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="document.body.classList.remove('sidebar-open')"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"><i data-lucide="paw-print" style="width: 20px; height: 20px; color: #fff;"></i></div>
        PetPlus
      </div>
      <p class="sidebar-subtitle">Pet Care &amp; Shelter Management</p>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Populated by js/app.js based on auth state & role -->
    </nav>

    <div class="sidebar-footer" id="sidebarFooter">
      <div class="user-badge" id="userBadge" style="display:none;">
        <span class="user-avatar" id="userAvatar">U</span>
        <div class="user-info">
          <span class="user-name" id="userName">User</span>
          <span class="user-role" id="userRole">ROLE</span>
        </div>
      </div>
      <button class="btn btn-outline w-full" id="logoutBtn" style="display:none;" onclick="App.auth.logout()">
        <i data-lucide="log-out"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="mainContent">
    <header class="page-header" id="pageHeader">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
      </button>
      <h1 class="page-title" id="pageTitle">PetPlus</h1>
    </header>

    <div class="page-body" id="pageBody">
      <div class="loading" id="initialLoader">
        <div class="spinner"></div>
      </div>
      <!-- Dynamic content rendered here by js/app.js -->
    </div>
  </main>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
